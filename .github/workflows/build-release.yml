name: build-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version (dotted numeric, no leading v)"
        required: true
        default: "0.3.3"

permissions:
  contents: read

jobs:
  build:
    name: build linux/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            os: ubuntu-latest
          - goarch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build and package plugin
        env:
          VERSION: ${{ inputs.version }}
        run: make package VERSION="$VERSION" ARCH=${{ matrix.goarch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cliproxyapi-copilot_${{ inputs.version }}_linux_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
