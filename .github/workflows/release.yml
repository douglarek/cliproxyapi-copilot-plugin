name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build linux/${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/src/.cache/home \
            -e GOCACHE=/src/.cache/go-build \
            -e GOMODCACHE=/src/.cache/go-mod \
            -v "$PWD:/src" \
            -w /src \
            golang:1.26-bookworm \
            go test ./...

      - name: Build marketplace package
        run: make package VERSION=${{ needs.version.outputs.value }} ARCH=${{ matrix.arch }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/cliproxyapi-copilot_${{ needs.version.outputs.value }}_linux_${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true

      # The Plugins Store reads one checksums.txt covering every architecture.
      - name: Write checksums
        working-directory: dist
        run: sha256sum cliproxyapi-copilot_*.zip > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/cliproxyapi-copilot_${VERSION}_linux_amd64.zip" \
            "dist/cliproxyapi-copilot_${VERSION}_linux_arm64.zip" \
            dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
